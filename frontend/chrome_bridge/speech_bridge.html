<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice 1C Chrome Speech Bridge</title>
  <link rel="stylesheet" href="speech_bridge.css">
</head>
<body>
  <main>
    <div class="logo">1C</div>
    <section>
      <p class="eyebrow">Voice 1C</p>
      <h1 id="title">Chrome Speech Bridge</h1>
      <p id="status">ready</p>
      <div class="meter"><span id="meter"></span></div>
      <div class="box">
        <strong>Interim</strong>
        <p id="interim"></p>
      </div>
      <div class="box">
        <strong>Final</strong>
        <p id="final"></p>
      </div>
      <div class="actions">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>
    </section>
  </main>
  <script src="speech_bridge.js"></script>
</body>
</html>
